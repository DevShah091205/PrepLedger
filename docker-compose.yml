services:
  web:
    build: .
    env_file: .env
    volumes: [ "prepledger-data:/data" ]
    expose: [ "8000" ]
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: [ "80:80", "443:443" ]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [ web ]
    restart: unless-stopped
volumes:
  prepledger-data:
  caddy-data:
